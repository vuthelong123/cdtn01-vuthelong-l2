services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_sample_password_change_me}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-warranty_db}
      MYSQL_USER: ${MYSQL_USER:-warranty_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-warranty_sample_password_change_me}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./BT2/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./BT2/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  web:
    build:
      context: ./BT2
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DB_TYPE: ${DB_TYPE:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-warranty_db}
      DB_USER: ${DB_USER:-warranty_user}
      DB_PASSWORD: ${DB_PASSWORD:-warranty_sample_password_change_me}
      FLASK_SECRET: ${FLASK_SECRET:-sample-dev-secret-change-in-production}
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      PORT: ${PORT:-8000}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mysql_data:

